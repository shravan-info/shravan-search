<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shravan Search</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--line:#26364d;--muted:#9aabc1;--text:#edf4ff;--blue:#72a7ff;--green:#55d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1d3b67 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif;min-height:100vh}.wrap{width:min(900px,calc(100% - 32px));margin:0 auto;padding:70px 0 48px}.brand{text-align:center;margin-bottom:30px}.mark{display:inline-grid;place-items:center;width:54px;height:54px;border:1px solid #45658f;border-radius:17px;background:#172b47;color:var(--blue);font-size:25px;font-weight:800}.brand h1{font-size:clamp(34px,7vw,54px);letter-spacing:-2px;margin:12px 0 2px}.brand p{color:var(--muted);margin:0}.searchbox{display:flex;gap:10px;background:#fff;border-radius:17px;padding:7px}.searchbox input{flex:1;min-width:0;border:0;outline:0;padding:13px 14px;font-size:16px;color:#142033;background:transparent}.searchbox button{border:0;border-radius:12px;background:#2467d5;color:white;padding:0 22px;font-weight:700;cursor:pointer}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:17px 3px 25px}.status{color:var(--green)}#results{display:grid;gap:13px}.result{border:1px solid var(--line);background:#101b2c;border-radius:14px;padding:17px 18px}.result h2{font-size:19px;margin:0 0 5px}.result h2 a{color:#8db8ff;text-decoration:none}.url{color:#71d5a8;font-size:13px;overflow-wrap:anywhere}.desc{color:#c1ccdb;margin:7px 0 0;font-size:14px}.empty{border:1px dashed #34465f;border-radius:14px;padding:28px;text-align:center;color:var(--muted)}.foot{text-align:center;color:#718198;font-size:12px;margin-top:45px}@media(max-width:520px){.wrap{padding-top:42px}.searchbox button{padding:0 14px}.result{padding:14px}}
</style></head><body><main class="wrap"><header class="brand"><div class="mark">S</div><h1>Shravan Search</h1><p>Explore the web, one page at a time.</p></header>
<form class="searchbox" id="searchForm"><input id="query" type="search" placeholder="Search websites..." autocomplete="off" aria-label="Search websites"><button type="submit">Search</button></form>
<div class="meta"><span id="count">Loading index…</span><span class="status" id="state">Prototype · 100-page limit</span></div><section id="results" aria-live="polite"><div class="empty">Loading search index…</div></section><footer class="foot">Experimental crawler and search index. Results may be incomplete.</footer></main>
<script>
(()=>{const form=document.getElementById('searchForm'),input=document.getElementById('query'),results=document.getElementById('results'),count=document.getElementById('count'),state=document.getElementById('state');let pages=[];
const words=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\\s]/g,' ').split(/\\s+/).filter(Boolean);
function render(query=''){const terms=words(query);const ranked=pages.map(p=>{const title=words(p.title),desc=words(p.description),url=words(p.url);let score=0;for(const t of terms){if(title.includes(t))score+=5;if(desc.includes(t))score+=2;if(url.includes(t))score+=1;}return{p,score};}).filter(x=>!terms.length||x.score>0).sort((a,b)=>b.score-a.score);count.textContent=terms.length?(ranked.length+' results · '+pages.length+' indexed pages'):(pages.length+' pages indexed');if(!ranked.length){results.innerHTML='<div class="empty">No matching pages found. Try different keywords, or run the crawler.</div>';return;}results.replaceChildren();ranked.slice(0,50).forEach(({p})=>{const article=document.createElement('article');article.className='result';const h=document.createElement('h2'),a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=p.title||p.url;h.append(a);const link=document.createElement('div');link.className='url';link.textContent=p.url;const d=document.createElement('p');d.className='desc';d.textContent=p.description||'No description available.';article.append(h,link,d);results.append(article);});}
fetch('./data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Index unavailable');return r.json();}).then(data=>{pages=Array.isArray(data)?data:[];state.textContent='Index loaded';render(input.value);}).catch(()=>{count.textContent='Index not available';state.textContent='Setup required';results.innerHTML='<div class="empty">Could not load data.json. Check repository files.</div>';});
form.addEventListener('submit',e=>{e.preventDefault();render(input.value.trim());});input.addEventListener('input',()=>render(input.value.trim()));})();
</script></body></html>
